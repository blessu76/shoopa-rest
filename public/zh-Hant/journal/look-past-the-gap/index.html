    <h1>看看空格的另一頭</h1>
    <p>順著箭頭一路看到棋盤邊緣。</p>
  </header>
  <div class="prose"><p>想像朝右的箭頭前方有一個空格。空格後面若還有方塊，路就依然堵著。點擊前，先沿著箭頭指的方向一路看到棋盤邊緣。</p></div>
