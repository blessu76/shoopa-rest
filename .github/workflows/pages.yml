name: Deploy Shoopa to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * *'  # 매일 00:17 KST

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 비공개 웹킷 설치(잠금 파일 기준)
        uses: ./.github/actions/ipe-web-kit
        with:
          ssh-key: ${{ secrets.IPE_WEB_KIT_DEPLOY_KEY }}
      - name: 한국시간 기준으로 생성 및 검증
        run: |
          journal_date=$(TZ=Asia/Seoul date +%F)
          python3 scripts/build_site.py --date "$journal_date"   # build_meta.json 도 이 날짜로 바뀐다
          bash scripts/check.sh --date "$journal_date"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
